# Two-hour laptop pilot: original search and learning defaults.
# Stop launching collection/training after 105 minutes; hard exit at 120.
# Paired evaluation is restartable and may remain incomplete at the deadline.
base_config = "config/imba_chess_v4.toml"

[search]
simulations = 128
top_m = 16
max_depth = 32
maxvisit_init = 50.0
value_scale = 0.1
epsilon = 1e-8

[collection]
concurrent_games = 8
root_batch_tokens = 1024
max_game_plies = 512
fresh_positions = 4096

[replay]
window_positions = 50000
flush_games = 16
flush_positions = 2048

[learning]
lr = 1e-5
value_weight = 0.0
weight_decay = 0.01
grad_clip = 1.0
reuse = 2.0
microbatch_tokens = 1024

[run]
seed = 42
hours = 2.0
reserve_minutes = 15.0
drain_minutes = 10.0
screen_pairs = 50
confirmation_pairs = 250
