# 5090 stage-2 recipe of the running tactical fork (flatten-53250-vmix-tactical-s512-mm05):
# tactical Gumbel 512 (root forcing moves, opponent forcing floor, half-negamax edge Q, raw Q at
# value_scale 0.5 instead of min-max 0.1, see docs/POLICY_SURPRISE_WEIGHTING.md),
# accumulated updates, mixed search/outcome value labels, 3-horizon auxiliary value and regret restarts.
# On gpu_remote it runs with 12 CPU threads (OMP/MKL; see the run's remote.json).
base_config = "config/imba_chess_v4_aux3.toml"
# Regret restarts from supervised flattened update 53,250, stabilized learner.
# Changes vs regret-t02: replay 50k->1M, reuse 2->1, 4-microbatch accumulation, lr 1e-4->2e-4, clip 1->2,
# three auxiliary TD heads (lambda 0.8/0.9/0.95) at 0.15 each; main value label =
# 0.75 x game result + 0.25 x this ply search WDL (Lc0-style q_ratio), value weight 1.

[search]
simulations = 512
top_m = 16
max_depth = 32
maxvisit_init = 50.0
value_scale = 0.5
epsilon = 1e-8
rescale_values = false
root_forcing = true
forcing_floor = true
minimax_weight = 0.5

[collection]
concurrent_games = 256
root_batch_tokens = 1024
max_game_plies = 512
fresh_positions = 4096

[replay]
window_positions = 1000000
flush_games = 16
flush_positions = 2048

[learning]
lr = 2e-4
value_weight = 1.0
auxiliary_value_weight = 0.15
auxiliary_value_lambda = [0.8, 0.9, 0.95]
value_search_mix = 0.25
weight_decay = 0.01
grad_clip = 2.0
reuse = 1.0
microbatch_tokens = 1024
gradient_accumulation = 4

[run]
seed = 42
hours = 48.0
reserve_minutes = 15.0
drain_minutes = 10.0
screen_pairs = 50
confirmation_pairs = 250

[streaming]
block_rows = 10000
prefetch_blocks = 2
startup_timeout = 900.0
shutdown_timeout = 5.0

[regret]
capacity = 256
temperature = 0.2
ema_alpha = 0.5
