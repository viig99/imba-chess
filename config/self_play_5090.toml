base_config = "config/imba_chess_v4.toml"

[search]
simulations = 128
top_m = 16
max_depth = 32
maxvisit_init = 50.0
value_scale = 0.1
epsilon = 1e-8

[collection]
concurrent_games = 32
root_batch_tokens = 1024
max_game_plies = 512
fresh_positions = 32768

[replay]
