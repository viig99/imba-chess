[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "imba-chess-native"
version = "0.1.0"
description = "Owned native chess primitives for imba-chess"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.maturin]
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
